<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7cc8f5">
<title>Toy Catch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-screen="title" class="booting">
  <!-- the result stars' shapes and lights (3D: no outlines — see .stars in style.css) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="st3Shape" d="M50.00 12.00 L61.17 36.63 L88.04 39.64 L68.07 57.87 L73.51 84.36 L50.00 71.00 L26.49 84.36 L31.93 57.87 L11.96 39.64 L38.83 36.63Z"/>
      <path id="st3Inner" d="M50.00 21.00 L58.52 40.27 L79.48 42.42 L63.79 56.48 L68.22 77.08 L50.00 66.50 L31.78 77.08 L36.21 56.48 L20.52 42.42 L41.48 40.27Z"/>
      <linearGradient id="st3Face" x1=".25" y1=".05" x2=".7" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset=".38" stop-color="#ffd23a"/><stop offset=".78" stop-color="#ffab12"/><stop offset="1" stop-color="#f08c05"/></linearGradient>
      <linearGradient id="st3Puff" x1=".2" y1="0" x2=".75" y2="1"><stop offset="0" stop-color="#fffbd6" stop-opacity=".95"/><stop offset=".5" stop-color="#ffe46a" stop-opacity=".55"/><stop offset="1" stop-color="#ffc21f" stop-opacity="0"/></linearGradient>
      <linearGradient id="st3Edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e48a06"/><stop offset="1" stop-color="#b45f03"/></linearGradient>
      <linearGradient id="st3Slot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ccbec"/><stop offset="1" stop-color="#b4e2f7"/></linearGradient>
      <radialGradient id="st3Gloss"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <filter id="st3Soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
      <filter id="st3Inset" x="-20%" y="-20%" width="140%" height="140%">
        <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
        <feGaussianBlur stdDeviation="2.4"/><feOffset dy="3.2" result="dk"/>
        <feFlood flood-color="#1d5a9a" flood-opacity=".5"/><feComposite in2="dk" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="shade"/>
        <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
        <feGaussianBlur stdDeviation="1.4"/><feOffset dy="-2.2" result="lt"/>
        <feFlood flood-color="#ffffff" flood-opacity=".9"/><feComposite in2="lt" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="lip"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="lip"/></feMerge>
      </filter>
      <!-- the result ribbon's tails and the folds under the band's corners: the game's blue (P: the earlier pink, ?ribbon=pink) -->
      <linearGradient id="rbTail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62b6f8"/><stop offset=".22" stop-color="#3895eb"/><stop offset=".6" stop-color="#2374d6"/><stop offset="1" stop-color="#1859b6"/></linearGradient>
      <linearGradient id="rbFold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3780"/><stop offset="1" stop-color="#164c9f"/></linearGradient>
      <linearGradient id="rbTailP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f97aa6"/><stop offset=".22" stop-color="#ef5288"/><stop offset=".6" stop-color="#df396f"/><stop offset="1" stop-color="#c2255a"/></linearGradient>
      <linearGradient id="rbFoldP" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e1240"/><stop offset="1" stop-color="#b01d50"/></linearGradient>
    </defs>
  </svg>
  <div class="bg" id="bg"></div>
  <canvas id="stage" aria-label="claw machine"></canvas>

  <!-- floating coins, notes and sparkles round the machine -->
  <div class="deco" aria-hidden="true">
    <!-- --x: mockup-u from the machine's middle, --y: mockup-u under the marquee top (1 mu = 1/125.6 of the machine width);
         --k: coin size, --f: when it spins (each coin spins once every 4.2 s, all at different times);
         p-*: Magic Block's block pastels -->
    <i class="coin p-butter" style="--x:-65.6;--y:23.8;--d:0s;--f:-0.4s;--k:1">m</i>
    <i class="coin p-pink" style="--x:-77.1;--y:34.2;--d:-1.1s;--f:-2.9s;--k:.88">a</i>
    <i class="coin p-mint" style="--x:-65.9;--y:46;--d:-2.3s;--f:-1.5s;--k:.95">a</i>
    <i class="coin p-lavender" style="--x:-60.5;--y:74.9;--d:-0.6s;--f:-3.6s;--k:1.05">m</i>
    <i class="coin p-peach" style="--x:61.8;--y:33.9;--d:-1.7s;--f:-2.2s;--k:1">s</i>
    <i class="coin p-sky" style="--x:76;--y:49;--d:-0.3s;--f:-0.9s;--k:.9">t</i>
    <i class="coin p-butter" style="--x:67.8;--y:61.5;--d:-2.8s;--f:-3.2s;--k:.95">s</i>
    <i class="coin p-pink" style="--x:61.7;--y:75.2;--d:-1.4s;--f:-1.9s;--k:1.04">t</i>
    <!-- the logo's own music notes (tools/import_art.py --notes); --h: height in mu -->
    <i class="note n-beamed" style="--x:-65.4;--y:59.4;--d:-0.8s;--h:7.4"></i>
    <i class="note n-pink" style="--x:-73.6;--y:64.2;--d:-2s;--h:7"></i>
    <i class="note n-red" style="--x:67.4;--y:43.9;--d:-1.2s;--h:8.6"></i>
    <i class="note n-blue" style="--x:76.2;--y:71.1;--d:-2.6s;--h:8"></i>
    <i class="spark" style="--x:-77.5;--y:18.5;--s:3;--d:-0.4s"></i>
    <i class="spark" style="--x:-79.5;--y:22;--s:2;--d:-1.6s"></i>
    <i class="spark" style="--x:-70.5;--y:57.8;--s:2;--d:-0.9s"></i>
    <i class="spark" style="--x:-67.8;--y:66.4;--s:2;--d:-2.2s"></i>
    <i class="spark" style="--x:-72.2;--y:69.8;--s:3.4;--d:-1.3s"></i>
    <i class="spark" style="--x:69.1;--y:40.4;--s:2;--d:-0.2s"></i>
    <i class="spark" style="--x:65;--y:52.6;--s:2.6;--d:-1.9s"></i>
    <i class="spark" style="--x:71.3;--y:65.8;--s:2;--d:-2.7s"></i>
    <i class="spark" style="--x:68.3;--y:69;--s:3;--d:-1s"></i>
  </div>

  <img class="logo" id="logo" src="assets/img/logo.webp" alt="Toy Catch" draggable="false">
  <button class="start" id="start" aria-label="START"></button>   <!-- drawn by game.js buildStart() -->

  <!-- game HUD (score · target · time), like the game mockup -->
  <div class="hud" aria-live="polite">
    <!-- one row, no word labels: score + the caught-friends tray (left), the target letter (middle), time (right) -->
    <div class="hud-l">
      <div class="score"><i class="score-coin" aria-hidden="true"><svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="scEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e39b10"/><stop offset="1" stop-color="#b56c06"/></linearGradient>
          <linearGradient id="scRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b8"/><stop offset=".45" stop-color="#ffd84a"/><stop offset="1" stop-color="#f2a412"/></linearGradient>
          <linearGradient id="scFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eea21a"/><stop offset=".38" stop-color="#ffc42e"/><stop offset="1" stop-color="#ffd95c"/></linearGradient>
          <linearGradient id="scStar" x1=".2" y1=".08" x2=".78" y2=".95"><stop offset="0" stop-color="#fffbe2"/><stop offset=".45" stop-color="#ffe56e"/><stop offset="1" stop-color="#ffb61a"/></linearGradient>
          <radialGradient id="scGloss"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <filter id="scSoft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.5"/></filter>
        </defs>
        <circle cx="50" cy="54.5" r="45" fill="url(#scEdge)"/>
        <circle cx="50" cy="50" r="45" fill="url(#scRim)"/>
        <circle cx="50" cy="50" r="36" fill="url(#scFace)"/>
        <g transform="translate(0 1.6)">
          <path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" transform="translate(1.2 2.6)" fill="#a35a00" stroke="#a35a00" stroke-width="5" stroke-linejoin="round" opacity=".42" filter="url(#scSoft)"/>
          <path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" fill="url(#scStar)" stroke="url(#scStar)" stroke-width="5" stroke-linejoin="round"/>
          <ellipse cx="45" cy="40" rx="7" ry="3.4" fill="url(#scGloss)" transform="rotate(-28 45 40)"/>
        </g>
        <ellipse cx="33" cy="21" rx="13" ry="5.5" fill="url(#scGloss)" transform="rotate(-32 33 21)"/>
      </svg></i><b id="score" aria-label="Score">0</b></div>
      <div class="tray" id="tray"></div>
    </div>
    <div class="target" id="target">
      <div class="tg-main">
        <b class="tg-letter" id="tgLetter">M</b>
        <button class="tg-snd" id="tgSnd" aria-label="Listen again"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5z" fill="currentColor"/><path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="time" id="timeBox">
      <i class="watch" aria-hidden="true"><svg viewBox="0 0 64 64">
        <defs>
          <linearGradient id="swCase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27e"/><stop offset=".42" stop-color="#ffa52c"/><stop offset="1" stop-color="#f27d0e"/></linearGradient>
          <linearGradient id="swEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e06e0a"/><stop offset="1" stop-color="#b04f04"/></linearGradient>
          <linearGradient id="swWell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c25a05"/><stop offset=".55" stop-color="#ee8618"/><stop offset="1" stop-color="#ffc56c"/></linearGradient>
          <radialGradient id="swFace" cx=".44" cy=".38" r=".66"><stop offset="0" stop-color="#ffffff"/><stop offset=".68" stop-color="#fdf6ea"/><stop offset="1" stop-color="#e6d5bb"/></radialGradient>
          <linearGradient id="swKnob" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dc6a08"/><stop offset=".36" stop-color="#ffd585"/><stop offset=".6" stop-color="#ffaf3a"/><stop offset="1" stop-color="#d06206"/></linearGradient>
          <linearGradient id="swPush" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc760"/><stop offset="1" stop-color="#ea770e"/></linearGradient>
          <radialGradient id="swGloss"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <linearGradient id="swGlass" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".55" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <clipPath id="swDial"><circle cx="32" cy="36.6" r="18"/></clipPath>
          <filter id="swSh" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation=".8"/><feOffset dx=".6" dy="1.3"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g transform="rotate(-43 32 36)"><rect x="28.6" y="6.4" width="6.8" height="7" rx="2.2" fill="#b95205"/><rect x="28.6" y="5" width="6.8" height="7" rx="2.2" fill="url(#swPush)"/><rect x="29.8" y="5.8" width="2.4" height="2.2" rx="1.1" fill="#fff" opacity=".45"/></g>
        <g transform="rotate(43 32 36)"><rect x="28.6" y="6.4" width="6.8" height="7" rx="2.2" fill="#b95205"/><rect x="28.6" y="5" width="6.8" height="7" rx="2.2" fill="url(#swPush)"/><rect x="29.8" y="5.8" width="2.4" height="2.2" rx="1.1" fill="#fff" opacity=".45"/></g>
        <rect x="29.2" y="7.4" width="5.6" height="6" rx="1.4" fill="url(#swKnob)"/>
        <rect x="25.4" y="3.5" width="13.2" height="6" rx="3" fill="#b95205"/>
        <rect x="25.4" y="2" width="13.2" height="6" rx="3" fill="url(#swKnob)"/>
        <ellipse cx="30.2" cy="3.7" rx="3.4" ry="1.1" fill="url(#swGloss)"/>
        <circle cx="32" cy="38.5" r="25" fill="url(#swEdge)"/>
        <circle cx="32" cy="36" r="25" fill="url(#swCase)"/>
        <ellipse cx="21.5" cy="19.5" rx="9.5" ry="4.2" fill="url(#swGloss)" transform="rotate(-40 21.5 19.5)"/>
        <circle cx="32" cy="36" r="19.8" fill="url(#swWell)"/>
        <circle cx="32" cy="36.6" r="18" fill="url(#swFace)"/>
        <g fill="#cdb898"><rect x="30.9" y="20.6" width="2.2" height="3.4" rx="1.1" transform="rotate(0 32 36)"/><circle cx="39.80" cy="22.49" r="0.95"/><circle cx="45.51" cy="28.20" r="0.95"/><rect x="30.9" y="20.6" width="2.2" height="3.4" rx="1.1" transform="rotate(90 32 36)"/><circle cx="45.51" cy="43.80" r="0.95"/><circle cx="39.80" cy="49.51" r="0.95"/><rect x="30.9" y="20.6" width="2.2" height="3.4" rx="1.1" transform="rotate(180 32 36)"/><circle cx="24.20" cy="49.51" r="0.95"/><circle cx="18.49" cy="43.80" r="0.95"/><rect x="30.9" y="20.6" width="2.2" height="3.4" rx="1.1" transform="rotate(270 32 36)"/><circle cx="18.49" cy="28.20" r="0.95"/><circle cx="24.20" cy="22.49" r="0.95"/></g>
        <g filter="url(#swSh)">
          <path d="M32 36l7.4 4.6" stroke="#3d3a52" stroke-width="3.3" stroke-linecap="round"/>
          <path id="watchHand" d="M32 38.8V21.6" stroke="#f0453a" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="36" r="3.1" fill="#3d3a52"/>
        </g>
        <circle cx="31.2" cy="35.2" r="1.05" fill="#fff" opacity=".75"/>
        <g clip-path="url(#swDial)"><ellipse cx="25" cy="25" rx="15" ry="9" transform="rotate(-32 25 25)" fill="url(#swGlass)" opacity=".7"/></g>
      </svg></i>
      <div class="pill"><b id="time" aria-label="Time">45s</b></div>
    </div>
  </div>

  <!-- sound · exit (every screen) -->
  <div class="sys">
    <button class="lang-tog" id="btnLang" data-l="en" aria-label="Voice language: English or Korean" aria-pressed="false"><span class="knob"></span><span class="flag on" data-l="en">EN</span><span class="flag" data-l="ko">한</span></button>
    <button class="sysbtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5z" fill="currentColor"/><g class="on"><path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g><g class="off"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></g></svg></button>
    <button class="sysbtn" id="btnExit" aria-label="Exit"><svg viewBox="0 0 24 24"><path d="M10 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <!-- controls: the joystick's grab area (over the 3D stick) and the tap area of the 3D DOWN button -->
  <div class="joy-hit" id="joyHit" aria-label="Move the claw"></div>
  <button class="drop" id="drop" aria-label="Down"></button>   <!-- invisible: over the 3D DOWN button on the panel -->

  <div class="prompt go" id="go">GO!</div>
  <div class="prompt big" id="bigMsg"></div>

  <!-- the prize: the caught friend's word -->
  <div class="prize" id="prize"><div class="word" id="prizeWord"></div></div>

  <div class="result" id="result">
    <div class="card">
      <div class="ribbon" id="ribbon"><i class="rb-tail l"><svg viewBox="0 0 95 130" preserveAspectRatio="none" aria-hidden="true">
          <path d="M95 32 L5 32 L31 77 L5 122 L95 122 Z" fill="url(#rbTail)" stroke="url(#rbTail)" stroke-width="8" stroke-linejoin="round"/>
          <path d="M75 96 L95 96 L95 123 L75 99.5 Z" fill="url(#rbFold)"/>
        </svg></i><i class="rb-tail r"><svg viewBox="0 0 95 130" preserveAspectRatio="none" aria-hidden="true">
          <path d="M95 32 L5 32 L31 77 L5 122 L95 122 Z" fill="url(#rbTail)" stroke="url(#rbTail)" stroke-width="8" stroke-linejoin="round"/>
          <path d="M75 96 L95 96 L95 123 L75 99.5 Z" fill="url(#rbFold)"/>
        </svg></i><span class="rb-band"><span class="res-title" id="resTitle" role="heading" aria-level="2" aria-label="GREAT JOB!"></span></span></div>   <!-- the title: game.js resultTitle() jelly letters on the ribbon -->
      <!-- three coin-stars (the HUD score coin; its gradients sc* are document-wide): a round slot sunk into the glass,
           an earned one pops in as a gold coin -->
      <div class="stars" id="stars"><i><svg viewBox="0 0 100 100" aria-hidden="true">
        <g class="slot"><circle cx="50" cy="52" r="45" fill="url(#st3Slot)" filter="url(#st3Inset)"/><path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" transform="translate(0 3)" fill="#a3d6f1" stroke="#a3d6f1" stroke-width="5" stroke-linejoin="round"/></g>
        <g class="gold">
          <circle cx="50" cy="54.5" r="45" fill="url(#scEdge)"/>
          <circle cx="50" cy="50" r="45" fill="url(#scRim)"/>
          <circle cx="50" cy="50" r="36" fill="url(#scFace)"/>
          <g transform="translate(0 1.6)">
            <path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" transform="translate(1.2 2.6)" fill="#a35a00" stroke="#a35a00" stroke-width="5" stroke-linejoin="round" opacity=".42" filter="url(#scSoft)"/>
            <path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" fill="url(#scStar)" stroke="url(#scStar)" stroke-width="5" stroke-linejoin="round"/>
            <ellipse cx="45" cy="40" rx="7" ry="3.4" fill="url(#scGloss)" transform="rotate(-28 45 40)"/>
          </g>
          <ellipse cx="33" cy="21" rx="13" ry="5.5" fill="url(#scGloss)" transform="rotate(-32 33 21)"/>
        </g>
      </svg></i><i><svg viewBox="0 0 100 100" aria-hidden="true">
        <g class="slot"><circle cx="50" cy="52" r="45" fill="url(#st3Slot)" filter="url(#st3Inset)"/><path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" transform="translate(0 3)" fill="#a3d6f1" stroke="#a3d6f1" stroke-width="5" stroke-linejoin="round"/></g>
        <g class="gold">
          <circle cx="50" cy="54.5" r="45" fill="url(#scEdge)"/>
          <circle cx="50" cy="50" r="45" fill="url(#scRim)"/>
          <circle cx="50" cy="50" r="36" fill="url(#scFace)"/>
          <g transform="translate(0 1.6)">
            <path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" transform="translate(1.2 2.6)" fill="#a35a00" stroke="#a35a00" stroke-width="5" stroke-linejoin="round" opacity=".42" filter="url(#scSoft)"/>
            <path d="M50.00 29.00 L55.88 41.91 L69.97 43.51 L59.51 53.09 L62.34 66.99 L50.00 60.00 L37.66 66.99 L40.49 53.09 L30.03 43.51 L44.12 41.91Z" fill="url(#scStar)" stroke="url(#scStar)" stroke-width="5" stroke-linejoin="round"/>
            <ellipse cx="45" cy="40" rx="7" ry="3.4" fill="url(#scGloss)" transform="rotate(-28 45 40)"/>
          </g>
          <ellipse cx="33" cy="21" rx="13" ry="5.5" fill="url(#scGloss)" transform="rotate(-32 33 21)"/>
