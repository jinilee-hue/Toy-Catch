<!doctype html>
<!-- Toy Catch — dev viewer for the friends' 3D shapes: every friend from the front, 3/4, side and back
     (?kinds=monkey,ant  ?spin to turn them  ?puff / ?flat for the earlier versions) -->
<html><head><meta charset="utf-8"><title>friends 3D</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#cfe3f5;overflow:hidden}canvas{display:block}#l{position:fixed;left:8px;top:6px;font:600 13px system-ui;color:#234}</style>
</head><body><div id="l"></div>
<script src="../vendor/three.iife.js"></script>
<script src="../js/friends-art.js"></script>
<script src="../js/friends-3d.js"></script>
<script src="../js/friends.js"></script>
<script>
(async () => {
  const T = THREE, qs = new URLSearchParams(location.search);
  const kinds = (qs.get('kinds') || Friends.KINDS.join(',')).split(',').filter(k => Friends.KINDS.includes(k));
  const ANG = [0, 40, 90, 180];
  const r = new T.WebGLRenderer({ antialias: true }); r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = T.SRGBColorSpace; r.setClearColor('#cfe3f5'); document.body.appendChild(r.domElement);
  const sc = new T.Scene(); sc.add(new T.HemisphereLight('#fff', '#ccd', 1.2));
  await Friends.load();
  const cols = ANG.length, rows = kinds.length, cw = 1.9, ch = 1.75;
  const all = [];
  kinds.forEach((k, j) => ANG.forEach((a, i) => {
    const P = Friends.build(k); P.faceCam = false;
    P.root.position.set((i - (cols - 1) / 2) * cw, -(j - (rows - 1) / 2) * ch - 0.65, 0);
    P.root.rotation.y = a * Math.PI / 180;
    sc.add(P.root); all.push([P, a]);
  }));
  const cam = new T.PerspectiveCamera(22, innerWidth / innerHeight, 0.1, 200);
  const span = Math.max(cols * cw / cam.aspect, rows * ch);
  cam.position.set(0, 0.6, span / (2 * Math.tan(11 * Math.PI / 180)) + 1); cam.lookAt(0, 0, 0);
  window.Stage = { camera: cam };
  document.getElementById('l').textContent = kinds.join(' · ') + ' — front · 3/4 · side · back' + (Object.keys(window.CLAW_FRIENDS_3D || {}).length ? '' : ' (no 3D data)');
  let t = 0, last = performance.now();
  const spin = qs.has('spin');
  (function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    for (const [P, a] of all) { P.update(dt, t); if (spin) P.root.rotation.y = a * Math.PI / 180 + t * 0.8; }
    r.render(sc, cam);
  })(last);
  window.__ready = true;
})();
</script></body></html>
