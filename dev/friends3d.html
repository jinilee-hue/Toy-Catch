<!doctype html>
<!-- Toy Catch — dev viewer for the friends' 3D shapes: every friend from the front, 3/4, side and back
     (?kinds=monkey,ant  ?spin[=speed] to turn them  ?row: one view each, 5 to a row  ?ang=0,40: these views only
     ?ortho: straight on, no perspective  ?still: no idle motion  ?puff / ?flat for the earlier versions
     ?parts: the rig's bones in colour (js/rig.js) · &held: hanging by the neck · &hop: the selection hops
     ?pose[=strength]: each friend plays its signature pose (js/poses.js) over and over · ?pose=loop: the gentle loop
     it does while the claw is over it · &weights: the pose parts' weights in colour) -->
<html><head><meta charset="utf-8"><title>friends 3D</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#cfe3f5;overflow:hidden}canvas{display:block}#l{position:fixed;left:8px;top:6px;font:600 13px system-ui;color:#234}</style>
</head><body><div id="l"></div>
<script src="../vendor/three.iife.js"></script>
<script src="../js/friends-art.js"></script>
<script src="../js/friends-3d.js"></script>
<script src="../js/rig.js"></script>
<script src="../js/poses.js"></script>
<script src="../js/friends.js"></script>
<script>
(async () => {
  const T = THREE, qs = new URLSearchParams(location.search);
  const kinds = (qs.get('kinds') || Friends.KINDS.join(',')).split(',').filter(k => Friends.KINDS.includes(k));
  const ROW = qs.has('row'), ANG = ROW ? [0] : qs.get('ang') ? qs.get('ang').split(',').map(Number) : [0, 40, 90, 180];
  if (qs.has('weights') && window.Poses) Poses.debug = true;
  if (qs.has('parts') && window.Rig) Rig.debug = true;
  const r = new T.WebGLRenderer({ antialias: true }); r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = T.SRGBColorSpace; r.setClearColor('#cfe3f5'); document.body.appendChild(r.domElement);
  const sc = new T.Scene(); sc.add(new T.HemisphereLight('#fff', '#ccd', 1.2));
  await Friends.load();
  if (qs.has('orbit')) return orbit();
  function orbit() {
    // ?orbit: one big friend in the middle to look over from every side — drag (mouse/touch) turns it freely (yaw and
    // pitch, top and bottom included), wheel / pinch zooms, double-click resets, ← → keys or the buttons step through
    const box = document.createElement('div');
    box.innerHTML = '<button id="ob-prev" aria-label="previous">◀</button><span id="ob-name"></span><button id="ob-next" aria-label="next">▶</button>';
    box.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;font:700 18px system-ui;color:#234;user-select:none';
    for (const b of box.querySelectorAll('button')) b.style.cssText = 'width:52px;height:52px;border-radius:26px;border:0;background:#fff;box-shadow:0 2px 8px #0003;font:700 20px system-ui;color:#2a5bd7;cursor:pointer';
    document.body.appendChild(box);
    document.getElementById('l').textContent = 'drag: turn · wheel/pinch: zoom · double-click: reset · ← →: friends';
    const cam = new T.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
    window.Stage = { camera: cam };
    const piv = new T.Group(); sc.add(piv);
    let idx = Math.max(0, kinds.indexOf(qs.get('kind'))), P = null, yaw = 0, pitch = 0, dist = 3.2;
    const reset = () => { yaw = (parseFloat(qs.get('yaw')) || 0) * Math.PI / 180; pitch = (parseFloat(qs.get('pitch')) || 0) * Math.PI / 180; dist = 3.2 / (parseFloat(qs.get('zoom')) || 1); };
    const show = (i) => {
      idx = (i + kinds.length) % kinds.length;
      if (P) piv.remove(P.root);
      P = Friends.build(kinds[idx]); P.faceCam = false;
      if (qs.has('clay')) {                                       // ?clay: the bare shape (no picture/atlas), lit from the upper left
        const clay = new T.MeshStandardMaterial({ color: '#e8e2d8', roughness: 0.55, metalness: 0 });
        P.root.traverse((o) => { if (o.isMesh) o.material = clay; });
        if (!sc.userData.clayLight) { const dl = new T.DirectionalLight('#fff', 2.2); dl.position.set(-2, 3, 4); cam.add(dl); sc.add(cam); sc.userData.clayLight = dl; }
      }
      const b = new T.Box3().setFromObject(P.root), c = b.getCenter(new T.Vector3());
      P.root.position.sub(c);                                     // (turns about its own middle)
      piv.add(P.root);
      document.getElementById('ob-name').textContent = kinds[idx];
      window.__orbit.kind = kinds[idx];
    };
    window.__orbit = { set: (y, p, z) => { yaw = y * Math.PI / 180; pitch = p * Math.PI / 180; if (z) dist = 3.2 / z; }, show: (k) => show(kinds.indexOf(k)) };
    reset(); show(idx);
    document.getElementById('ob-prev').onclick = () => show(idx - 1);
    document.getElementById('ob-next').onclick = () => show(idx + 1);
    addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') show(idx - 1); if (e.key === 'ArrowRight') show(idx + 1); });
    const cv = r.domElement, pts = new Map();
    cv.style.touchAction = 'none';
    let pinch = 0;
    cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); });
    cv.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      const [x0, y0] = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 1) {
        yaw += (e.clientX - x0) * 0.01; pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch + (e.clientY - y0) * 0.01));
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinch) dist = Math.max(1.2, Math.min(8, dist * pinch / d));
        pinch = d;
      }
    });
    const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.max(1.2, Math.min(8, dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });
    cv.addEventListener('dblclick', reset);
    addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
    let t = 0, last = performance.now();
    const advance = (dt) => {
      t += dt;
      piv.rotation.set(pitch, yaw, 0, 'XYZ');                     // (yaw about its own up, then tipped toward you)
      cam.position.set(0, 0, dist); cam.lookAt(0, 0, 0);
      if (P && qs.has('idle')) P.update(dt, t);
      r.render(sc, cam);
    };
    window.__step = advance;
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!window.__frozen) advance(dt);
    })(last);
    window.__ready = true;
  }
  const cols = ROW ? Math.min(5, kinds.length) : ANG.length, rows = ROW ? Math.ceil(kinds.length / cols) : kinds.length, cw = 1.9, ch = 1.75;
  const all = [];
  kinds.forEach((k, j) => ANG.forEach((a, i) => {
    const P = Friends.build(k); P.faceCam = false;
    const c = ROW ? j % cols : i, rr = ROW ? Math.floor(j / cols) : j;
    P.root.position.set((c - (cols - 1) / 2) * cw, -(rr - (rows - 1) / 2) * ch - 0.65, 0);
    P.root.rotation.y = a * Math.PI / 180;
    if (qs.has('held')) P.hold(true);                 // &held: hanging from the claw by the neck (limbs dangle)
    if (qs.has('hop')) P.excite(1);                   // &hop: under the claw (selection hops)
    sc.add(P.root); all.push([P, a]);
  }));
  const cam = new T.PerspectiveCamera(22, innerWidth / innerHeight, 0.1, 200);
  const span = Math.max(cols * cw / cam.aspect, rows * ch);
  cam.position.set(0, 0.6, span / (2 * Math.tan(11 * Math.PI / 180)) / (parseFloat(qs.get('zoom')) || 1) + 1); cam.lookAt(0, 0, 0);
  if (qs.has('ortho')) {                    // ?ortho: straight from the front, no perspective (compare with the pictures)
    const oc = new T.OrthographicCamera(-span * cam.aspect / 2, span * cam.aspect / 2, span / 2, -span / 2, 0.1, 200);
    oc.position.set(0, 0, 20); oc.lookAt(0, 0, 0); window.Stage = { camera: oc };
  } else window.Stage = { camera: cam };
  const view = window.Stage.camera;
  document.getElementById('l').textContent = ROW ? '' : kinds.join(' · ') + ' — ' + ANG.map(a => ({ 0: 'front', 40: '3/4', 90: 'side', 180: 'back' })[a] || a + '°').join(' · ') + (Object.keys(window.CLAW_FRIENDS_3D || {}).length ? '' : ' (no 3D data)');
  let t = 0, last = performance.now();
  const spin = qs.has('spin') ? (parseFloat(qs.get('spin')) || 0.8) : 0, still = qs.has('still');   // ?still: no idle motion
  // poses: one after another with a short rest (all friends in step, so frame N is the same moment for everyone)
  const POSE = qs.has('pose') ? qs.get('pose') : null, LOOP = POSE === 'loop', PK = parseFloat(POSE) || 1;
  if (LOOP) for (const [P] of all) P.poseLoop && P.poseLoop(true);
  const posing = POSE != null && !LOOP && window.Poses;
  const next = new Map();
  window.__poseAt = (sec) => { for (const [P] of all) next.set(P, sec); };   // (QA: restart every pose at t = sec)
  if (posing) window.__poseAt(0.4);
  const advance = (dt) => {
    t += dt;
    for (const [P, a] of all) {
      if (posing && P.pose && t >= next.get(P)) { P.pose(PK); next.set(P, t + (Poses.DATA[P.kind] ? Poses.DATA[P.kind].dur : 1.5) + 0.6); }
      if (!still) P.update(dt, t); if (spin) P.root.rotation.y = a * Math.PI / 180 + t * spin;
    }
    r.render(sc, view);
  };
  window.__step = advance;                  // (QA: set window.__frozen = true, then step frame by frame)
  (function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!window.__frozen) advance(dt);
  })(last);
  window.__ready = true;
})();
</script></body></html>
